name: Android Release Build (Final Fix)

on:
  push:
    branches: [ "**" ] # Срабатывает на любой пуш
  workflow_dispatch:

jobs:
  build:
    name: Build Android arm64
    runs-on: ubuntu-latest

    env:
      QT_VERSION: 6.8.0
      ANDROID_NDK_VERSION: r26b
      # Секреты для приложения
      PROD_AGW_PUBLIC_KEY: ${{ secrets.PROD_AGW_PUBLIC_KEY }}
      DEV_AGW_PUBLIC_KEY: ${{ secrets.DEV_AGW_PUBLIC_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 1. Установка Ninja (обязательно)
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential libgl1-mesa-dev

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Установка Qt (создает переменную env.Qt6_DIR)
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtremoteobjects qt5compat qtimageformats qtshadertools'
          cache: true

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      # 3. Подготовка Keystore (ключ подписи)
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      # 4. Конфигурация CMake
      # ВНИМАНИЕ: Здесь использована ${{ env.Qt6_DIR }} вместо $QT_ROOT_DIR
      - name: Configure CMake
        run: |
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_ANDROID_BUILD_ALL_ABIS=OFF \
            -DANDROID_ABI=arm64-v8a \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.Qt6_DIR }}/lib/cmake/Qt6/qt.toolchain.cmake \
            -DANDROID_SDK_ROOT=$ANDROID_HOME \
            -DANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }} \
            -DCMAKE_MAKE_PROGRAM=$(which ninja) \
            -DQT_ANDROID_Sign_Package=ON \
            -DQT_ANDROID_KEYSTORE_PATH=$(pwd)/release.keystore \
            -DQT_ANDROID_KEYSTORE_STORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASS }} \
            -DQT_ANDROID_KEYSTORE_ALIAS=${{ secrets.ANDROID_KEYSTORE_ALIAS }} \
            -DQT_ANDROID_KEYSTORE_KEY_PASS=${{ secrets.ANDROID_KEY_PASS }}

      - name: Build
        run: cmake --build build --parallel

      - name: Package APK
        run: cmake --build build --target android-make-apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmneziaVPN-Release-arm64
          path: build/android-build/*.apk
          retention-days: 7

name: Android Release Build (Mirror Fix)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android arm64
    runs-on: ubuntu-latest

    env:
      # Версия 6.7.2 поддерживает нужную политику QTP0002
      QT_VERSION: 6.7.2
      ANDROID_NDK_VERSION: r26b
      PROD_AGW_PUBLIC_KEY: ${{ secrets.PROD_AGW_PUBLIC_KEY }}
      DEV_AGW_PUBLIC_KEY: ${{ secrets.DEV_AGW_PUBLIC_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential libgl1-mesa-dev python3-pip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Install aqtinstall
        run: |
          python3 -m pip install aqtinstall

      # ШАГ 1: Ручная установка Host Qt (С ЗЕРКАЛОМ)
      # Добавлен флаг --base https://mirrors.kernel.org/qt
      - name: Install Host Qt
        run: |
          python3 -m aqt install-qt linux desktop ${{ env.QT_VERSION }} gcc_64 \
            --outputdir ${{ runner.temp }}/Qt \
            --base https://mirrors.kernel.org/qt \
            --modules qtshadertools qt5compat

      # ШАГ 2: Ручная установка Target Qt (С ЗЕРКАЛОМ)
      - name: Install Android Qt
        run: |
          python3 -m aqt install-qt linux android ${{ env.QT_VERSION }} android_arm64_v8a \
            --outputdir ${{ runner.temp }}/Qt \
            --base https://mirrors.kernel.org/qt \
            --modules qtremoteobjects qt5compat qtimageformats qtshadertools

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      # ШАГ 3: Сборка
      - name: Configure CMake
        run: |
          # Пути фиксированы
          export QT_HOST_PATH=${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/gcc_64
          export QT_ANDROID_PATH=${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/android_arm64_v8a
          
          echo "Host Qt: $QT_HOST_PATH"
          echo "Android Qt: $QT_ANDROID_PATH"
          
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_ANDROID_BUILD_ALL_ABIS=OFF \
            -DANDROID_ABI=arm64-v8a \
            -DCMAKE_TOOLCHAIN_FILE=$QT_ANDROID_PATH/lib/cmake/Qt6/qt.toolchain.cmake \
            -DQT_HOST_PATH=$QT_HOST_PATH \
            -DANDROID_SDK_ROOT=$ANDROID_HOME \
            -DANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }} \
            -DCMAKE_MAKE_PROGRAM=$(which ninja) \
            -DQT_ANDROID_Sign_Package=ON \
            -DQT_ANDROID_KEYSTORE_PATH=$(pwd)/release.keystore \
            -DQT_ANDROID_KEYSTORE_STORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASS }} \
            -DQT_ANDROID_KEYSTORE_ALIAS=${{ secrets.ANDROID_KEYSTORE_ALIAS }} \
            -DQT_ANDROID_KEYSTORE_KEY_PASS=${{ secrets.ANDROID_KEY_PASS }}

      - name: Build
        run: cmake --build build --parallel

      - name: Package APK
        run: cmake --build build --target android-make-apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmneziaVPN-Release-arm64
          path: build/android-build/*.apk
          retention-days: 7

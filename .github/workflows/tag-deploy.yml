name: 'Release deploy workflow'

on: 
  workflow_dispatch:
  push:
    branches:
      - main # Сборка запускается при пуше в основную ветку
      - master 
  # tags:
  #   - ** # Можно раскомментировать, если захотите

jobs:

  Build-Android-Release:
    name: 'Build-Android-Release'
    runs-on: ubuntu-latest

    env:
      # Обновлены до версий из ваших последних логов
      QT_VERSION: 6.8.0
      ANDROID_NDK_VERSION: r26b 
      # Ваши секреты API, оставлены без изменений
      PROD_AGW_PUBLIC_KEY: ${{ secrets.PROD_AGW_PUBLIC_KEY }}
      PROD_S3_ENDPOINT: ${{ secrets.PROD_S3_ENDPOINT }}
      DEV_AGW_PUBLIC_KEY: ${{ secrets.DEV_AGW_PUBLIC_KEY }}
      DEV_AGW_ENDPOINT: ${{ secrets.DEV_AGW_ENDPOINT }}
      DEV_S3_ENDPOINT: ${{ secrets.DEV_S3_ENDPOINT }}
      FREE_V2_ENDPOINT: ${{ secrets.FREE_V2_ENDPOINT }}
      PREM_V1_ENDPOINT: ${{ secrets.PREM_V1_ENDPOINT }}

    steps:
    
    # Шаг 1: Получаем исходники и сабмодули
    - name: 'Get sources'
      uses: actions/checkout@v3
      with:
        path: main
        submodules: 'true' 
        fetch-depth: 10
        
    # Шаг 2: Устанавливаем NDK более чистым способом
    - name: 'Install Android NDK and SDK'
      uses: android-actions/setup-android@v3
      with:
        android-ndk-version: ${{ env.ANDROID_NDK_VERSION }}
        # SDK будет установлен в стандартный $ANDROID_HOME
        
    # Шаг 3: Устанавливаем Qt для Android
    - name: 'Install android Qt arm_v8'
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'android'
        arch: 'android_arm64_v8a'
        # Убраны лишние модули из старого списка, оставим только базовые
        modules: 'qtbase qtremoteobjects qt5compat qtimageformats qtshadertools'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        set-env: 'true'
        extra: '--external 7z'

    # Шаг 4: Настраиваем Java
    - name: 'Setup Java'
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17' # Актуальная версия для сборки

    # Шаг 5: Компиляция проекта (исправлены пути)
    - name: 'Build project'
      run: |
        # Устанавливаем переменные для скрипта сборки, используя новые пути
        export QT_ROOT_DIR=${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/android_arm64_v8a
        export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}
        export QT_BIN_DIR=$QT_ROOT_DIR/bin
        # Явно указываем путь к файлу Toolchain, чтобы CMake его нашел
        export CMAKE_TOOLCHAIN_FILE=$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake
        export CMAKE_PREFIX_PATH=$QT_ROOT_DIR

        cd main
        bash deploy/build_android.sh
        
    # Шаг 6: Подпись APK (использует ваши секреты)
    - name: 'Sign APK with custom keystore'
      id: sign_apk 
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: ${{ runner.temp }}/main/
        signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        alias: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        keyPassword: ${{ secrets.ANDROID_KEY_PASS }}
        apkFile: AmneziaVPN-release-unsigned.apk 

    # Шаг 7: Загрузка готового APK
    - name: 'Upload Signed APK'
      uses: actions/upload-artifact@v3
      with:
        name: Release APK Signed
        path: ${{ steps.sign_apk.outputs.signedReleaseFile }}

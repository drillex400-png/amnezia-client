name: Fast Android Build (Debug)

on:
  workflow_dispatch: # Запуск по кнопке
  push:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    
    env:
      # Используем 6.8.0, так как она у тебя успешно качалась
      QT_VERSION: 6.8.0
      ANDROID_NDK_VERSION: r26b

    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ставим Ninja (ускоритель сборки)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential libgl1-mesa-dev

      - name: Настраиваем Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Установка Qt (ОДНИМ БЛОКОМ для простоты)
      - name: Установка Qt (Desktop + Android)
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          # Ставим сразу и для компа (host), и для телефона (target)
          host: 'linux'
          target: 'desktop android'
          arch: 'gcc_64 android_arm64_v8a'
          dir: ${{ runner.temp }}
          cache: true
          modules: 'qtshadertools qt5compat qtremoteobjects qtimageformats'

      - name: Настройка NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      # ГЛАВНЫЙ ФОКУС: Создаем временный ключ на лету
      # Это избавляет от возни с Secrets в настройках
      - name: Генерация ключа подписи
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Конфигурация CMake
        run: |
          export QT_HOST_PATH=${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/gcc_64
          export QT_ANDROID_PATH=${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/android_arm64_v8a
          
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQT_ANDROID_BUILD_ALL_ABIS=OFF \
            -DANDROID_ABI=arm64-v8a \
            -DCMAKE_TOOLCHAIN_FILE=$QT_ANDROID_PATH/lib/cmake/Qt6/qt.toolchain.cmake \
            -DQT_HOST_PATH=$QT_HOST_PATH \
            -DANDROID_SDK_ROOT=$ANDROID_HOME \
            -DANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }} \
            -DCMAKE_MAKE_PROGRAM=$(which ninja) \
            -DQT_ANDROID_Sign_Package=ON \
            -DQT_ANDROID_KEYSTORE_PATH=$(pwd)/debug.keystore \
            -DQT_ANDROID_KEYSTORE_STORE_PASS=android \
            -DQT_ANDROID_KEYSTORE_ALIAS=androiddebugkey \
            -DQT_ANDROID_KEYSTORE_KEY_PASS=android

      - name: Сборка APK
        run: cmake --build build --target android-make-apk --parallel

      - name: Скачать готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: Amnezia-Fast-Debug
          path: build/android-build/*.apk
          retention-days: 3

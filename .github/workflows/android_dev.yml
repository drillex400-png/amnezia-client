name: Fast Android Build (Debug Fixed)

on:
  workflow_dispatch: # Кнопка запуска
  push:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    
    env:
      QT_VERSION: 6.8.0
      ANDROID_NDK_VERSION: r26b

    steps:
      - name: Скачиваем код
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ставим Ninja (ускоритель)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential libgl1-mesa-dev

      - name: Настраиваем Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # --- ИСПРАВЛЕНИЕ: Версия установщика и разделение шагов ---

      # 1. Desktop (Host) - Инструменты сборки
      - name: Установка Qt (Desktop Host)
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          dir: ${{ runner.temp }}
          cache: true
          # ВАЖНО: Принудительно ставим новую версию установщика
          aqtversion: '==3.3.0'
          modules: 'qtshadertools qt5compat'

      # 2. Android (Target) - Библиотеки для телефона
      - name: Установка Qt (Android Target)
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          dir: ${{ runner.temp }}
          cache: true
          # ВАЖНО: Принудительно ставим новую версию установщика
          aqtversion: '==3.3.0'
          modules: 'qtshadertools qt5compat qtremoteobjects qtimageformats'

      # --- КОНЕЦ ИСПРАВЛЕНИЯ ---

      - name: Настройка NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Генерация временного ключа
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Конфигурация CMake
        run: |
          export QT_HOST_PATH=${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/gcc_64
          export QT_ANDROID_PATH=${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/android_arm64_v8a
          
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DQT_ANDROID_BUILD_ALL_ABIS=OFF \
            -DANDROID_ABI=arm64-v8a \
            -DCMAKE_TOOLCHAIN_FILE=$QT_ANDROID_PATH/lib/cmake/Qt6/qt.toolchain.cmake \
            -DQT_HOST_PATH=$QT_HOST_PATH \
            -DANDROID_SDK_ROOT=$ANDROID_HOME \
            -DANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }} \
            -DCMAKE_MAKE_PROGRAM=$(which ninja) \
            -DQT_ANDROID_Sign_Package=ON \
            -DQT_ANDROID_KEYSTORE_PATH=$(pwd)/debug.keystore \
            -DQT_ANDROID_KEYSTORE_STORE_PASS=android \
            -DQT_ANDROID_KEYSTORE_ALIAS=androiddebugkey \
            -DQT_ANDROID_KEYSTORE_KEY_PASS=android

      - name: Сборка APK
        run: cmake --build build --target android-make-apk --parallel

      - name: Скачать готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: Amnezia-Fast-Debug
          path: build/android-build/*.apk
          retention-days: 3

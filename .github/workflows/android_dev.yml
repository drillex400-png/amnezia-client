name: Android Dev Build (Fork Optimized)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android arm64
    runs-on: ubuntu-latest

    env:
      QT_VERSION: 6.8.0
      ANDROID_NDK_VERSION: r26b
      PROD_AGW_PUBLIC_KEY: ""
      DEV_AGW_PUBLIC_KEY: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 1. НОВОЕ: Устанавливаем системные инструменты сборки (Ninja + Make)
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential libgl1-mesa-dev

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtremoteobjects qt5compat qtimageformats qtshadertools'
          cache: true

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      # 2. ИЗМЕНЕНО: Добавлен флаг -GNinja и явный путь к Ninja
      - name: Configure CMake
        run: |
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_ANDROID_BUILD_ALL_ABIS=OFF \
            -DANDROID_ABI=arm64-v8a \
            -DCMAKE_TOOLCHAIN_FILE=$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake \
            -DANDROID_SDK_ROOT=$ANDROID_HOME \
            -DANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }} \
            -DCMAKE_MAKE_PROGRAM=$(which ninja) \
            -DQT_ANDROID_Sign_Package=ON \
            -DQT_ANDROID_KEYSTORE_PATH=$(pwd)/debug.keystore \
            -DQT_ANDROID_KEYSTORE_STORE_PASS=android \
            -DQT_ANDROID_KEYSTORE_ALIAS=androiddebugkey \
            -DQT_ANDROID_KEYSTORE_KEY_PASS=android

      - name: Build
        run: cmake --build build --parallel

      - name: Package APK
        run: cmake --build build --target android-make-apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmneziaVPN-Dev-arm64
          path: build/android-build/*.apk
          retention-days: 7
